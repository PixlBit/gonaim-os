<!doctype html><html><head><meta charset="utf-8"><title>فحص نموذج</title>
<style>html,body{margin:0;background:#eee}</style></head><body>
<script src="../vendor/three.js"></script>
<script>
(function(){
  const q=new URLSearchParams(location.search), W=900,H=700;
  const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
  r.setSize(W,H); r.setPixelRatio(1); r.shadowMap.enabled=true;
  r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1;
  document.body.appendChild(r.domElement);
  const sc=new THREE.Scene(); sc.background=new THREE.Color(0xdfe3e8);
  const cam=new THREE.PerspectiveCamera(35,W/H,0.05,500);
  const key=new THREE.DirectionalLight(0xffffff,2.8); key.position.set(5,7,6); key.castShadow=true; sc.add(key);
  const fill=new THREE.DirectionalLight(0xcfe0f5,0.8); fill.position.set(-6,4,-3); sc.add(fill);
  sc.add(new THREE.HemisphereLight(0xffffff,0xccc4b0,1.0));
  const g=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0xdfe3e8,roughness:1}));
  g.rotation.x=-Math.PI/2; g.receiveShadow=true; sc.add(g);
  new THREE.GLTFLoader().load('../assets/models/'+q.get('f'),(gl)=>{
    const o=gl.scene; o.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});
    const box=new THREE.Box3().setFromObject(o), size=new THREE.Vector3(), c=new THREE.Vector3();
    box.getSize(size); box.getCenter(c);
    o.position.set(-c.x,-box.min.y,-c.z); sc.add(o);
    const R=Math.max(size.x,size.y,size.z)*0.5||1, t=new THREE.Vector3(0,size.y*0.45,0);
    const d=R/Math.tan(THREE.MathUtils.degToRad(17.5))*1.3, az=0.7, el=0.32;
    cam.position.set(t.x+d*Math.cos(el)*Math.sin(az),t.y+d*Math.sin(el),t.z+d*Math.cos(el)*Math.cos(az));
    cam.lookAt(t); key.target.position.copy(t); sc.add(key.target);
    r.render(sc,cam);
    let tris=0,meshes=0; o.traverse(n=>{if(n.isMesh){meshes++;const i=n.geometry.index;tris+=(i?i.count:n.geometry.attributes.position.count)/3;}});
    window.MV={ok:true,size:size.toArray().map(v=>+v.toFixed(2)),meshes,tris:Math.round(tris)};
  },undefined,(e)=>{window.MV={ok:false,err:String(e&&e.message||e)};});
})();
</script></body></html>
