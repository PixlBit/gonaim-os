# تشغيل إحنا على خادم.
#
#   cp .env.example .env         واضبط EHNA_SECRET وEHNA_DOMAIN
#   docker compose -f docker-compose.ehna.yml run --rm ehna npm run ehna:setup
#   docker compose -f docker-compose.ehna.yml up -d
#
# الخدمتان: المنصة، وCaddy الذي يجلب شهادة HTTPS وحده ويجددها. بلا دومين
# احذف خدمة caddy وافتح 8788 مباشرة — لكن ساعتها اضبط EHNA_SECURE_COOKIE=0
# لأن المتصفح لا يرسل كوكي Secure على http.
services:
  ehna:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # مطلوب — بلا سر لا جلسات. يولّده npm run ehna:setup
      EHNA_SECRET: ${EHNA_SECRET:?اضبط EHNA_SECRET في .env}
      EHNA_DIR: /data
      EHNA_BACKUPS: /data/backups
      # خلف Caddy الاتصال https، فالكوكي Secure
      EHNA_SECURE_COOKIE: ${EHNA_SECURE_COOKIE:-1}
      # اختياري بالكامل: بدونه المنصة تعمل وتعرض الوقائع بصيغتها الحتمية
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EHNA_MODEL: ${EHNA_MODEL:-}
      # اتركه فارغًا للتخزين على ملف داخل المجلد أعلاه
      EHNA_DATABASE_URL: ${EHNA_DATABASE_URL:-}
    volumes:
      - ehna-data:/data
    expose:
      - "8788"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      EHNA_DOMAIN: ${EHNA_DOMAIN:?اضبط EHNA_DOMAIN في .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ehna

volumes:
  ehna-data:
  caddy-data:
  caddy-config:
